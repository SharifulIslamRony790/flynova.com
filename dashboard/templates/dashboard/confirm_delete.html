{% extends 'dashboard/base_admin.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5 mt-5">
        <div class="premium-card text-center py-5 px-4 shadow-lg border-0" style="border-radius: 16px;">
            <div class="mb-4">
                <div class="d-inline-flex align-items-center justify-content-center bg-danger bg-opacity-10 rounded-circle" style="width: 80px; height: 80px;">
                    <i class="fas fa-exclamation-triangle text-danger fa-2x"></i>
                </div>
            </div>
            
            <h3 class="fw-bold text-dark mb-3">Delete {{ item_type }}?</h3>
            <p class="text-muted mb-4 fs-6 px-3">
                Are you sure you want to delete <strong>{{ item_name }}</strong>? 
                <br>This action cannot be undone and will permanently remove all associated data.
            </p>
            
            <form method="POST" class="d-flex justify-content-center gap-3">
                {% csrf_token %}
                <a href="{{ cancel_url }}" class="btn btn-light px-4 py-2 fw-medium rounded-pill" style="min-width: 120px;">
                    Cancel
                </a>
                <button type="submit" class="btn btn-danger px-4 py-2 fw-medium rounded-pill shadow-sm" style="min-width: 120px;">
                    Yes, Delete
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
